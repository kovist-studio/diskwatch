name: build

# Release builds. Artifacts AND their SHA-256 checksums are produced only here,
# in CI — never generated or published from a developer machine. The checksums
# are appended to the GitHub Release notes so users can verify their downloads.
#
# Each platform builds natively on its own runner — macOS installers on macOS,
# Windows installers on Windows — so nothing is cross-compiled for a release.
#
# Hardening note: the actions below are pinned to major-version tags for
# readability. For a stronger supply-chain posture, pin each to a full commit
# SHA.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create/edit Releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The renderer loads d3-hierarchy from a vendored copy rather than from
      # node_modules. Prove the copy still matches the package before shipping
      # it to anyone.
      - name: Verify vendored dependency matches node_modules
        run: npm run verify:vendor

      # macOS: .dmg for arm64 and x64. Windows: NSIS .exe for x64.
      # Both are UNSIGNED by design — see README "A note on signing".
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder picking up any
      # signing identity that happens to exist on the runner, so what ships is
      # never dependent on which machine built it.
      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --publish never

      - name: List what was built
        shell: bash
        run: ls -lh dist/

      # Only the installers travel onward. The unpacked app directories and the
      # auto-update blockmaps are build intermediates, and checksumming a
      # 373 MB unpacked tree would bury the two lines users actually need.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Checksum and release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # This job deliberately does NOT check out the repository — it only needs
    # the built artifacts, not the source. But `gh` infers which repository to
    # act on from the git remote of the working directory, so with no checkout
    # it fails with "not a git repository" before it makes a single API call.
    # GH_REPO tells it directly, which is cheaper and more explicit than
    # cloning the source purely to publish three files.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums (CI only)
        working-directory: artifacts
        run: |
          # Checksum every artifact. This is the only place checksums are made.
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's|\./||' > SHA256SUMS.txt
          echo '----- SHA256SUMS.txt -----'
          cat SHA256SUMS.txt

      - name: Create release and upload artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: create the release with auto-generated notes if it
          # doesn't exist yet.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          # Attach every artifact, including the checksum file itself.
          gh release upload "$TAG" artifacts/* --clobber

      - name: Append checksums to release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY="$(gh release view "$TAG" --json body --jq .body)"
          # Don't double-append if this step runs again.
          if printf '%s' "$BODY" | grep -q '## SHA-256 checksums'; then
            echo 'Checksums already present in notes; skipping.'
            exit 0
          fi
          {
            printf '%s\n\n' "$BODY"
            printf '## SHA-256 checksums\n\n'
            printf 'Generated in CI. Verify your download matches:\n\n'
            printf '```\n'
            cat artifacts/SHA256SUMS.txt
            printf '```\n'
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
